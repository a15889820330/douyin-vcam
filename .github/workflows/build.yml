name: build-dylib

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # 注意：不要用 macos-14 / macos-latest，它们可能被解析成 arm64 机型，
    # 部分账号会报 "configuration 'macos-14-arm64-us-default' is not supported"
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/bin" >> "$GITHUB_PATH"

      - name: 安装 iOS SDK（只取需要的那个，避免拉整个仓库）
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cd "$RUNNER_TEMP/sdks"
          git sparse-checkout set iPhoneOS16.5.sdk || true
          if [ ! -d "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" ]; then
            echo "没取到 16.5，改为全部拉取"
            git sparse-checkout disable
          fi
          SDK=$(ls "$RUNNER_TEMP/sdks" | grep '^iPhoneOS' | sort -V | tail -1)
          echo "使用 SDK: $SDK"
          cp -R "$RUNNER_TEMP/sdks/$SDK" "$THEOS/sdks/"

      - name: 安装 ldid（Theos 签名必需）
        run: |
          brew install ldid || true
          if command -v ldid >/dev/null 2>&1; then
            ln -sf "$(command -v ldid)" "$THEOS/bin/ldid"
          else
            echo "brew 装不上，改用预编译二进制"
            curl -L -o "$THEOS/bin/ldid" \
              https://github.com/theos/ldid/releases/latest/download/ldid_macosx_x86_64
            chmod +x "$THEOS/bin/ldid"
          fi
          "$THEOS/bin/ldid" -v 2>&1 | head -3 || true

      - name: 编译
        run: |
          set +e
          make -j4 > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "===== 编译失败，关键错误行如下 ====="
            # 把错误行写成注解：注解是公开可读的，方便外部排查
            grep -n -E "error:|Error:|fatal error|undefined symbol|No such file|not found|error" build.log \
              | grep -v -E "^\s*$" | head -25 | while IFS= read -r line; do
                echo "::error::$line"
              done
            echo "===== 最后 40 行 ====="
            tail -40 build.log
            exit $code
          fi
          tail -20 build.log

      - name: 收集产物
        run: |
          mkdir -p out
          find .theos -name '*.dylib' -print
          A=".theos/obj/arm64/DouyinVCam.dylib"
          B=".theos/obj/arm64e/DouyinVCam.dylib"
          if [ -f "$A" ] && [ -f "$B" ]; then
            lipo -create -output out/DouyinVCam.dylib "$A" "$B"
            lipo -info out/DouyinVCam.dylib
          else
            echo "只有单架构，直接拷贝"
            find .theos -name '*.dylib' -exec cp {} out/ \;
          fi
          ls -lh out

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: DouyinVCam-dylib
          path: out/*.dylib
          if-no-files-found: error
